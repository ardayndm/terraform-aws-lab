name: Terraform Deploy

on:
  push:
    branches:
      - master
permissions:
  id-token: write
  contents: read
jobs:
  # ==============================================
  # STAGING
  # ==============================================

  staging-plan:
    name: Terraform Plan (Staging)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: "arn:aws:iam::870318142654:role/GitHubActionsTerraformPlan"
          aws-region: eu-north-1
          allowed-account-ids: 870318142654

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: environments/staging
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: environments/staging
        run: terraform plan -input=false -lock-timeout=2m -out=tfplan

      - name: Upload Staging Plan
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-staging
          path: environments/staging/tfplan

  staging-apply:
    name: Terraform Apply (Staging)
    runs-on: ubuntu-latest
    needs: staging-plan
    environment: staging
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: "arn:aws:iam::870318142654:role/GitHubActionsTerraformStaging"
          aws-region: eu-north-1
          allowed-account-ids: 870318142654

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: environments/staging
        run: terraform init -input=false

      - name: Download Staging Plan
        uses: actions/download-artifact@v5
        with:
          name: tfplan-staging
          path: environments/staging

      - name: Terraform Apply
        working-directory: environments/staging
        run: terraform apply -input=false -lock-timeout=2m tfplan

  # ==============================================
  # PRODUCTION
  # ==============================================

  production-plan:
    name: Terraform Plan (Production)
    runs-on: ubuntu-latest
    needs: staging-apply

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: "arn:aws:iam::870318142654:role/GitHubActionsTerraformPlan"
          aws-region: eu-north-1
          allowed-account-ids: 870318142654

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -lock-timeout=2m -out=tfplan

      - name: Upload Production Plan
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-production
          path: tfplan

  production-apply:
    name: Terraform Apply (Production)
    runs-on: ubuntu-latest
    needs: production-plan
    environment: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: "arn:aws:iam::870318142654:role/GitHubActionsTerraformApply"
          aws-region: eu-north-1
          allowed-account-ids: 870318142654

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init -input=false

      - name: Download Production Plan
        uses: actions/download-artifact@v5
        with:
          name: tfplan-production

      - name: Terraform Apply
        run: terraform apply -input=false -lock-timeout=2m tfplan
